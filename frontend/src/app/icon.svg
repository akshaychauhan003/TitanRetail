<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Light Mode Gradient: Vibrant Retail Emerald -->
    <linearGradient id="titan-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Dark Mode Gradient: Luminous Mint/Emerald for high dark-tab contrast -->
    <linearGradient id="titan-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 3D Isometric Cube Facets -->
    <linearGradient id="cube-top-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <linearGradient id="cube-left-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="cube-right-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="titan-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .titan-squircle {
      fill: url(#titan-bg-light);
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 1.5;
    }
    .facet-top { fill: url(#cube-top-light); }
    .facet-left { fill: url(#cube-left-light); }
    .facet-right { fill: url(#cube-right-light); }
    .seam-line { stroke: rgba(4, 120, 87, 0.35); stroke-width: 1.5; }
    .tape-strip { fill: rgba(255, 255, 255, 0.9); }

    @media (prefers-color-scheme: dark) {
      .titan-squircle {
        fill: url(#titan-bg-dark);
        stroke: rgba(255, 255, 255, 0.45);
        stroke-width: 1.5;
      }
      .facet-top { fill: #ffffff; }
      .facet-left { fill: #e6fffa; }
      .facet-right { fill: #bbf7d0; }
      .seam-line { stroke: rgba(4, 120, 87, 0.45); stroke-width: 1.5; }
      .tape-strip { fill: #ffffff; }
    }
  </style>

  <!-- Squircle Base Container with Soft Depth Shadow -->
  <rect class="titan-squircle" x="4" y="4" width="56" height="56" rx="14" ry="14" filter="url(#titan-shadow)" />

  <!-- 3D Geometric Isometric Retail Package / Box -->
  <g transform="translate(0, 0.5)">
    <!-- Top Diamond Facet -->
    <polygon class="facet-top" points="32,15 47,23.5 32,32 17,23.5" />

    <!-- Left Facet -->
    <polygon class="facet-left" points="17,23.5 32,32 32,49 17,40.5" />

    <!-- Right Facet -->
    <polygon class="facet-right" points="32,32 47,23.5 47,40.5 32,49" />

    <!-- Inner Seam Lines for Definition -->
    <polyline points="17,23.5 32,32 47,23.5" fill="none" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.2" stroke-linejoin="round" />
    <line class="seam-line" x1="32" y1="32" x2="32" y2="49" />

    <!-- Packaging Tape Feature (Express Retail Brand Accent) -->
    <!-- Top tape segment -->
    <polygon class="tape-strip" points="30,16 34,18.3 34,31 30,28.7" opacity="0.9" />
    <!-- Front tape segment -->
    <polygon class="tape-strip" points="30,28.7 34,31 34,44 30,41.7" opacity="0.8" />
  </g>
</svg>
